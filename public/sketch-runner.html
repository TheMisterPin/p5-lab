<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sketch preview</title>
  <style>
    :root { --paper: #fafafa; --ink: #252630; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); }
    body { display: grid; place-items: center; min-height: 100vh; }
    #canvas-root { width: 100%; }
    canvas { display: block; max-width: 100%; height: auto !important; margin: auto; }
  </style>
</head>
<body>
  <main id="canvas-root" aria-label="Your p5.js sketch"></main>
  <script src="./runtime/sketch.js"></script>
</body>
</html>
